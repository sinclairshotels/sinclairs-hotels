name: CI

on:
  push:
    branches: [main, prod]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sinclairs
          POSTGRES_PASSWORD: sinclairs_dev
          POSTGRES_DB: sinclairs_hotels
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sinclairs:sinclairs_dev@localhost:5432/sinclairs_hotels
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma migrate deploy

      # The A0 migration can only backfill room types that already had a rate or
      # a booking — SQL cannot read content/hotels/*.ts. On a fresh database that
      # is none, so without this every test that books a room finds no RoomType.
      - run: pnpm sync:rooms

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
